services:
  # AcexGateway All-in-One: AceStream Engine + Elixir/OTP Relay Hub
  acex-gateway:
    image: ghcr.io/quaywin/acex:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acex-gateway
    restart: unless-stopped
    ports:
      - "8686:8686"       # AcexGateway Web Dashboard, M3U & Stream Relay
      - "6878:6878"       # AceStream HTTP API
      - "62062:62062"     # AceStream Telnet API
      - "8621:8621/tcp"   # P2P Incoming Swarm
      - "8621:8621/udp"
    volumes:
      - ./data:/app/data
    tmpfs:
      - /root/.ACEStream/cache:size=1024M,mode=1777
      - /root/.ACEStream/buffer:size=512M,mode=1777
      - /root/.ACEStream/content_cache:size=1024M,mode=1777
      - /tmp:size=256M,mode=1777
    environment:
      - PORT=8686
      - ACE_TELNET_HOST=127.0.0.1
      - ACE_TELNET_PORT=62062
      - ACE_HTTP_PORT=6878
      - GRACE_PERIOD_MS=5000
      - ACE_LIVE_BUFFER=25
      - ACE_MAX_PEERS=60
      - ACE_EARLY_FAILOVER_TIMEOUT_MS=10000
      - ACE_START_TIMEOUT_MS=60000
      - CHANNELS_FILE=/app/data/channels.json
      - DEFAULT_CHANNEL_ID=dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c
